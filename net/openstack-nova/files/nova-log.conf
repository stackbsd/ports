# Log rotation for the nova services
#
# logfilename                  [owner:group]  mode count size when flags  [/pidfile]
/var/log/nova_api.log          root:wheel     640  7     1000 *    C      /var/run/nova_api.pid
/var/log/nova_scheduler.log    root:wheel     640  7     1000 *    C      /var/run/nova_scheduler.pid
/var/log/nova_conductor.log    root:wheel     640  7     1000 *    C      /var/run/nova_conductor.pid
/var/log/nova_compute.log      root:wheel     640  7     1000 *    C      /var/run/nova_compute.pid
