# Log rotation for the ironic services
#
# logfilename                  [owner:group]  mode count size when flags  [/pidfile]
/var/log/ironic_api.log        root:wheel     640  7     1000 *    C      /var/run/ironic_api.pid
/var/log/ironic_conductor.log  root:wheel     640  7     1000 *    C      /var/run/ironic_conductor.pid
