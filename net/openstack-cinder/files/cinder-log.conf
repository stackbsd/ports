# Log rotation for the cinder services
#
# logfilename                  [owner:group]  mode count size when flags  [/pidfile]
/var/log/cinder_api.log        root:wheel     640  7     1000 *    C      /var/run/cinder_api.pid
/var/log/cinder_scheduler.log  root:wheel     640  7     1000 *    C      /var/run/cinder_scheduler.pid
/var/log/cinder_volume.log     root:wheel     640  7     1000 *    C      /var/run/cinder_volume.pid
