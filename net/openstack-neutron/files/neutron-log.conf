# Log rotation for the neutron services
#
# logfilename                     [owner:group]  mode count size when flags  [/pidfile]
/var/log/neutron_api.log          root:wheel     640  7     1000 *    C      /var/run/neutron_api.pid
/var/log/neutron_rpc_server.log   root:wheel     640  7     1000 *    C      /var/run/neutron_rpc_server.pid
