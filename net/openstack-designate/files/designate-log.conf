# Log rotation for the designate services
#
# logfilename                    [owner:group]  mode count size when flags  [/pidfile]
/var/log/designate_api.log       root:wheel     640  7     1000 *    C      /var/run/designate_api.pid
/var/log/designate_central.log   root:wheel     640  7     1000 *    C      /var/run/designate_central.pid
/var/log/designate_mdns.log      root:wheel     640  7     1000 *    C      /var/run/designate_mdns.pid
/var/log/designate_producer.log  root:wheel     640  7     1000 *    C      /var/run/designate_producer.pid
/var/log/designate_worker.log    root:wheel     640  7     1000 *    C      /var/run/designate_worker.pid
